[project]
name = "marketbridge-demo"
version = "0.1.0"
description = "Off-hours reference pricing and source-quality guard for NVDA/TSLA with receipt-ordered verification, multi-family corroboration, and split-conformal uncertainty bands"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

